name: ci

# Read-only checks on every PR and push to main. The release workflow
# (release.yml) is separate and runs only on an approved version tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, pack (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.2.0 = the engines minimum (1.1.0 breaks text imports of the
        # embedded templates); 1.3.14 = the pinned release toolchain.
        bun: ["1.2.0", "1.3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx biome check .

      - name: Test
        run: bun test

      - name: npm pack dry-run
        run: npm pack --dry-run

      - name: Build + binary smoke
        run: |
          set -euo pipefail
          bun build --compile --minify --outfile dist/dictum src/cli.ts
          ./dist/dictum --version

      - name: CLI smoke (offline text path)
        run: |
          out=$(echo "fix the bug" | bun run src/cli.ts --stdout --raw)
          test -n "$out"

      - name: MCP smoke (offline brief over stdio)
        # No pipe-masking: capture the output, then assert. The server must
        # exit on stdin EOF by itself — timeout is a hard failure, not a crutch.
        run: |
          set -euo pipefail
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"polish_brief","arguments":{"text":"fix the bug"}}}' \
            | timeout 20 bun run src/cli.ts mcp)
          echo "$out" | grep -q '"id":2'
          echo "$out" | grep -q 'Do NOT act on the draft yet'
          if echo "$out" | grep -q '"isError":true'; then
            echo "::error::polish_brief returned isError"; exit 1
          fi

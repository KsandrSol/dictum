name: release

# Runs only when a version tag is pushed. Push exactly ONE approved release
# tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) — never `--tags`,
# which would bulk-push every local tag. The gate job below rejects anything
# that is not a strict vX.Y.Z matching package.json and reachable from the
# public `main`; only the final publish job holds contents:write.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Strict semver tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Tag '$GITHUB_REF_NAME' is not vX.Y.Z"; exit 1; }

      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          [[ "v$pkg" == "$GITHUB_REF_NAME" ]] \
            || { echo "::error::Tag $GITHUB_REF_NAME != package.json v$pkg"; exit 1; }

      - name: Tag is reachable from the public main
        # A mistagged commit from a private dev branch must never release —
        # with the split-history model this is the wall that keeps private
        # history out of public artifacts.
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tagged commit is not on the public main"; exit 1; }

  # Read-only: the write credential must not be ambient while third-party
  # code (checkout/install/test/build) runs.
  binaries:
    name: Build standalone binaries
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, test
        run: |
          bunx tsc --noEmit
          bunx biome check .
          bun test

      - name: Build binaries (linux + darwin, x64 + arm64)
        run: bash scripts/build-binaries.sh

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum dictum-linux-x64 dictum-linux-arm64 dictum-darwin-x64 dictum-darwin-arm64 > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-binaries
          path: |
            dist/dictum-linux-x64
            dist/dictum-linux-arm64
            dist/dictum-darwin-x64
            dist/dictum-darwin-arm64
            dist/SHA256SUMS
          if-no-files-found: error

  # The ONLY job holding contents:write — it downloads the already-built
  # artifacts and publishes them; no checkout, no dependency install.
  publish:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: release-binaries
          path: dist

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            dist/dictum-linux-x64
            dist/dictum-linux-arm64
            dist/dictum-darwin-x64
            dist/dictum-darwin-arm64
            dist/SHA256SUMS
          generate_release_notes: true

  # npm publish is intentionally a manual step (the maintainer runs `npm publish`).
  # To automate it later, add a job here gated on an NPM_TOKEN secret.
